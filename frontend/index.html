<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business Saathi</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">BS</span>
        <div>
          <strong>Business Saathi</strong>
          <small id="shop-name">My Shop</small>
        </div>
      </div>
      <nav>
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/voice" data-route="voice">New Voice Order</a>
        <a href="#/orders/new" data-route="orders/new">Type an Order</a>
        <a href="#/orders" data-route="orders">Saved Orders</a>
      </nav>
      <p class="sidebar-note">Single shop · local/demo use only</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <form class="search" id="global-search" role="search">
          <label class="sr-only" for="global-search-input">Search orders</label>
          <input id="global-search-input" type="search" placeholder="Search saved orders (name, phone, product)">
          <button type="submit" class="btn btn-secondary">Search</button>
        </form>
      </header>
      <div id="notices" class="notices" aria-live="polite"></div>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
